name: Issue Completeness

on:
  issues:
    types: [opened]

permissions:
  models: read
  issues: write
jobs:
  analyze:
    name: AI Issue Completeness
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Install GitHub Copilot CLI"
        run: |
          npm install -g @github/copilot
          # Ensure copilot alias is registered in the environment
          echo "alias copilot='github-copilot-cli'" >> $GITHUB_ENV

      - name: "Authenticate Copilot CLI"
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONNEL_ACCESS_TOKEN }}
        run: |
          # Use the built-in Actions Token to authenticate the CLI session
          echo "Authenticating Copilot CLI session..."
          # copilot auth "$GITHUB_TOKEN"

      - name: "Run Claude Sonnet 5 Analysis"
        id: ai-response
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          echo "🤖 Initializing Automated AI Debugger..."
          # Construct an isolated prompt containing the issue data
          
          PROMPT="New issue was opened by $ISSUE_USER. Title: $ISSUE_TITLE. Description: $ISSUE_BODY"
          
          # Run Copilot CLI in headless execution mode
          # --allow-all-tools gives the model autonomy to read workspace files
          copilot request "$PROMPT" \
            --model claude-sonnet-5 \
            --allow-all-tools -p \
            --add-dir . > analysis_report.md
            
          echo "Analysis completed successfully."

      - name: Comment results on the issue
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.PERSONNEL_ACCESS_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          body: ${{ steps.ai-response.outputs.response }}

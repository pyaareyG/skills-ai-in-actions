name: Issue Completeness

on:
  issues:
    types: [opened]

permissions:
  models: read
  issues: write
jobs:
  analyze:
    name: AI Issue Completeness
    runs-on: ubuntu-latest
    env:
      COPILOT_GITHUB_TOKEN: ${{secrets.PERSONNEL_ACTION_TOKEN}}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Install GitHub Copilot CLI"
        run: |
          npm install -g @github/copilot
          # Ensure copilot alias is registered in the environment
          echo "alias copilot='github-copilot-cli'" >> $GITHUB_ENV

      - name: "Run Claude Sonnet 5 Analysis"
        id: ai-response
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          echo "🤖 Initializing Automated AI Debugger..."
          # Construct an isolated prompt containing the issue data
          
          PROMPT="New issue was opened by $ISSUE_USER. Title: $ISSUE_TITLE. Description: $ISSUE_BODY"
          
          # Run Copilot CLI in headless execution mode
          # --allow-all-tools gives the model autonomy to read workspace files
          copilot -p "$PROMPT" \
            --model claude-sonnet-5 \
            --allow-all-tools \
            --add-dir . > analysis_report.md
          echo "Analysis completed successfully."
          
      - name: "Post AI Report to Issue Thread"
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('analysis_report.md', 'utf8');
            
            const commentBody = `### 🤖 Automated AI Issue Analysis Report\n\n${report}\n\n*Powered by GitHub Copilot & Claude Sonnet 5*`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });


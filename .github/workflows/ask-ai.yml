name: Ask AI
on: 
  workflow_dispatch:
permissions: 
  models: read
jobs:
  ask-ai:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install azure-identity requests

    - name: Log in to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Call Foundry Model Endpoint
      env:
        FOUNDRY_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
      run: |
        python -c "
        import os
        import requests
        from azure.identity import DefaultAzureCredential

        # Obtain the Bearer token for Azure AI resources
        credential = DefaultAzureCredential()
        token = credential.get_token('https://azure.com')

        headers = {
            'Authorization': f'Bearer {token.token}',
            'Content-Type': 'application/json'
        }

        # Example payload structure for the Foundry Responses API
        payload = {
            'messages': [{'role': 'user', 'content': 'Hello from GitHub Actions!'}]
        }

        response = requests.post(os.environ['FOUNDRY_ENDPOINT'] + '/chat/completions', json=payload, headers=headers)
        print('Status Code:', response.status_code)
        print('Response:', response.json())
        "

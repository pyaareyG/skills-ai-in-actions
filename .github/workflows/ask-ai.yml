name: Ask AI
on:
  workflow_dispatch:

permissions:
  contents: read
  models: read
jobs:
  ask-ai:
    runs-on: ubuntu-latest
    env:
      COPILOT_GITHUB_TOKEN: ${{secrets.PERSONNEL_ACTION_TOKEN}}
    steps:
      - name: AI Inference
        id: ai-response
        run: |
          npm install -g @github/copilot
          RESPONSE=$(copilot --model claude-sonnet-5 --no-color -p "Give me a programming joke")
          {
            echo "## AI Response<<EOF"
            echo "$RESPONSE"
            echo "EOF"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Display AI response
        run: echo "${{ steps.ai-response.outputs.response }}"
